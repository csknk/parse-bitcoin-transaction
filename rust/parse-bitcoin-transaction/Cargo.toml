[package]
name = "parse-bitcoin-transaction"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
bech32 = "0.11.1"
bs58 = "0.5.1"
byteorder = "1.5.0"
clap = { version = "4.5.50", features = ["derive"] }
color-eyre = "0.6.5"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
